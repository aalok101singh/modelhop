[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelhop"
version = "1.0.7"
description = "Intelligent LLM router that saves 60-90% on API costs by hopping to the cheapest capable model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Aalok", email = "aalok101singh@users.noreply.github.com" }
]
keywords = ["llm", "routing", "cost-optimization", "ai", "openai", "groq", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "google-generativeai>=0.5",
    "groq>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/aalok101singh/modelhop"
Documentation = "https://github.com/aalok101singh/modelhop#readme"
Repository = "https://github.com/aalok101singh/modelhop"
Issues = "https://github.com/aalok101singh/modelhop/issues"

[project.scripts]
modelhop = "modelhop.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["modelhop"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
