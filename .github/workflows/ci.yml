name: CI

on:
  push:
    branches: [main, develop, deployment]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # server extra included so serve/ tests execute in the gate
          pip install -e ".[dev,server]"

      - name: Lint with ruff
        run: |
          ruff check modelhop/ tests/

      - name: Test with pytest + coverage gate
        run: |
          pytest --tb=short -q --cov=modelhop --cov-report=term --cov-fail-under=60

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check formatting
        run: |
          black --check modelhop/ tests/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
      - name: Dependency audit
        run: |
          pip-audit

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: CLI smoke tests
        run: |
          modelhop --help
          modelhop welcome
          modelhop providers --help
          modelhop stats --help
          modelhop route --help
          modelhop eval --help
          pytest tests/test_cli.py -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Security tests (injection, tamper, k-anonymity)
        run: |
          pytest tests/test_security_v11.py tests/test_trust.py -q

  gate:
    # Single required status check for branch protection: green only when
    # every CI job (all 15 test-matrix legs included) succeeded.
    # NOTE: no `name:` field here — GitHub reports the job id (`gate`) as
    # the check context, which is exactly what protection requires.
    runs-on: ubuntu-latest
    needs: [test, lint, audit, cli-smoke, security]
    if: always()
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'EOF'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: info.get("result")
              for name, info in needs.items()
              if info.get("result") != "success"
          }
          if failed:
              raise SystemExit(f"gate blocked, non-success jobs: {failed}")
          print("gate: all required jobs succeeded")
          EOF
