name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build cyclonedx-bom
      - name: Build package
        run: python -m build
      - name: SBOM (CycloneDX)
        run: |
          cyclonedx-py requirements -o sbom.json || python -m cyclonedx_py.client -o sbom.json || echo "sbom skipped"
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a6ddee5b05f5401961c674b7b67c30c62 # v4.6.0
        with:
          name: dist
          path: dist/
      - name: Upload SBOM
        uses: actions/upload-artifact@65c4c4a6ddee5b05f5401961c674b7b67c30c62 # v4.6.0
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00eac0b0cca50a2c73 # v4.1.8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing, no token)
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1
      - name: Sign release (sigstore)
        uses: sigstore/gh-action-sigstore-python@e0d9c14c1a07849e3b0f8ca27d3c2d15480675a # v3.0.0
        with:
          inputs: ./dist/*
